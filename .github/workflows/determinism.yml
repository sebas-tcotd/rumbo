# S4 · Determinismo: los replays dorados (grabados en nativo) se re-simulan con el WASM en
# Node, Chromium, Firefox, WebKit y Safari, y tienen que dar exactamente los mismos hashes.
name: Determinismo

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: determinism-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    name: Pruebas nativas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Installs exactly the toolchain in rust-toolchain.toml.
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: rustc --version && cargo --version
      - run: cargo test --release --workspace

  wasm:
    name: Compilar WASM y verificar en Node
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Installs exactly the toolchain in rust-toolchain.toml (wasm32 target included).
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack@0.15.1
      # No `version:`: pnpm/action-setup reads it from `packageManager`. Corepack is not used.
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: rustc --version && cargo --version && node --version && wasm-pack --version
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run build
      - run: pnpm turbo run test --filter @rumbo/contracts --filter @rumbo/sim-worker --force
      - run: pnpm exec biome lint packages
      - run: pnpm --filter rumbo-determinism exec playwright install --with-deps chromium
      - run: node --test ci/determinism/worker-integration.test.mjs
      - run: node ci/determinism/lab-smoke.mjs
      - run: node ci/determinism/lab-smoke.mjs --dev
      - run: node run.mjs --browser node --out results
        working-directory: ci/determinism
      - uses: actions/upload-artifact@v7
        with:
          name: sim-wasm-pkg
          path: crates/sim-wasm/pkg
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: results-node
          path: ci/determinism/results

  browsers:
    name: ${{ matrix.browser }}
    needs: wasm
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { browser: chromium, os: ubuntu-latest }
          - { browser: firefox, os: ubuntu-latest }
          - { browser: webkit, os: macos-latest }
          - { browser: safari, os: macos-latest }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: sim-wasm-pkg
          path: crates/sim-wasm/pkg
      # No `version:`: pnpm/action-setup reads it from `packageManager`. Corepack is not used.
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      # pkg/ comes from the artifact above and is not rebuilt; the link to @rumbo/sim-wasm builds nothing.
      - run: pnpm install --frozen-lockfile --filter rumbo-determinism
      - if: matrix.browser != 'safari'
        run: pnpm exec playwright install --with-deps ${{ matrix.browser }}
        working-directory: ci/determinism
      - if: matrix.browser == 'safari'
        run: sudo safaridriver --enable
      - run: node run.mjs --browser ${{ matrix.browser }} --out results
        working-directory: ci/determinism
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: results-${{ matrix.browser }}
          path: ci/determinism/results

  summary:
    name: Resumen
    needs: [wasm, browsers]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: results-*
          path: all-results
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          # Nothing is installed here, so there is no pnpm store to cache.
          package-manager-cache: false
      - run: node ci/determinism/summary.mjs all-results | tee -a "$GITHUB_STEP_SUMMARY"
