# S4 · Determinismo: los replays dorados (grabados en nativo) se re-simulan con el WASM en
# Node, Chromium, Firefox, WebKit y Safari, y tienen que dar exactamente los mismos hashes.
name: Determinismo

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: determinism-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    name: Pruebas nativas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --release --workspace

  wasm:
    name: Compilar WASM y verificar en Node
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack
      - run: wasm-pack build crates/sim-wasm --target web --release --out-dir pkg
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm ci
        working-directory: ci/determinism
      - run: node run.mjs --browser node --out results
        working-directory: ci/determinism
      - uses: actions/upload-artifact@v5
        with:
          name: sim-wasm-pkg
          path: crates/sim-wasm/pkg
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: results-node
          path: ci/determinism/results

  browsers:
    name: ${{ matrix.browser }}
    needs: wasm
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { browser: chromium, os: ubuntu-latest }
          - { browser: firefox, os: ubuntu-latest }
          - { browser: webkit, os: macos-latest }
          - { browser: safari, os: macos-latest }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          name: sim-wasm-pkg
          path: crates/sim-wasm/pkg
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm ci
        working-directory: ci/determinism
      - if: matrix.browser != 'safari'
        run: npx playwright install --with-deps ${{ matrix.browser }}
        working-directory: ci/determinism
      - if: matrix.browser == 'safari'
        run: sudo safaridriver --enable
      - run: node run.mjs --browser ${{ matrix.browser }} --out results
        working-directory: ci/determinism
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: results-${{ matrix.browser }}
          path: ci/determinism/results

  summary:
    name: Resumen
    needs: [wasm, browsers]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          pattern: results-*
          path: all-results
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: node ci/determinism/summary.mjs all-results | tee -a "$GITHUB_STEP_SUMMARY"
