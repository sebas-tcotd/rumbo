[workspace]
resolver = "2"
members = ["crates/track-format", "crates/sim-core", "crates/sim-wasm", "crates/track-compiler-core", "crates/compiler-cli"]

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "UNLICENSED"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

# Las pruebas de física en modo debug son muy lentas; se optimizan también en test.
[profile.test]
opt-level = 3

[profile.dev.package."*"]
opt-level = 3

# Every direct dependency is pinned to an exact version (`=x.y.z`) matching Cargo.lock.
# Bumping any of them is a deliberate change with its own PR; bumping anything that
# sim-core uses needs a `physics:` commit and regenerated golden replays.
[workspace.dependencies]
# Simulation determinism contract: exact version and features.
rapier3d = { version = "=0.36.1", default-features = false, features = ["std", "dim3", "f32", "enhanced-determinism"] }
# Must match the wasm-bindgen-cli that wasm-pack 0.15.1 downloads (it reads Cargo.lock).
wasm-bindgen = "=0.2.130"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.154", features = ["float_roundtrip"] }  # same in native and WASM
libm = "=0.2.16"
tiff = "=0.11.3"
# Pure shared kernel and new binary content contracts.
track-format = { path = "crates/track-format" }
postcard = { version = "=1.1.3", default-features = false, features = ["alloc"] }
blake3 = "=1.8.4"
thiserror = "=2.0.21"

# Lints for every crate (story 0.7, ADR-005). Each crate opts in with `[lints] workspace = true`;
# ci/layers/check.mjs fails when one does not. CI runs clippy with `-D warnings -A clippy::pedantic`:
# pedantic is a visible warning locally and in the CI summary, never a blocking error.
[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
allow_attributes_without_reason = "deny"
