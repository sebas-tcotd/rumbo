<!doctype html>
<html lang="es">
<head><meta charset="utf-8"><title>Determinismo</title></head>
<body>
<pre id="log">Verificando replays…</pre>
<script type="module">
  // WASM de prueba (sim-wasm con la feature `harness`), nunca el binario de publicación.
  import init, { verify_replay, trace_replay, physics_version } from '/ci/determinism/wasm/sim_wasm.js';
  const out = { userAgent: navigator.userAgent, results: [] };
  const log = document.getElementById('log');
  try {
    await init();
    out.physics = physics_version();
    const cases = await (await fetch('/__cases.json')).json();
    for (const c of cases) {
      const [track, replay] = await Promise.all([fetch(c.track).then((r) => r.text()), fetch(c.replay).then((r) => r.text())]);
      const t0 = performance.now();
      const res = { case: c.name };
      try {
        res.report = JSON.parse(verify_replay(track, replay));
        const t = JSON.parse(trace_replay(track, replay));
        res.ticks = t.ticks;
        res.trace = t.trace;
      } catch (e) {
        res.error = String(e);
      }
      res.ms = Math.round(performance.now() - t0);
      out.results.push(res);
      log.textContent += `\n${res.report?.ok ? 'OK   ' : 'FALLA'} ${c.name} ${res.report?.actualFinal ?? res.error ?? ''}`;
      await new Promise((r) => setTimeout(r, 0)); // deja respirar al hilo para el sondeo del driver
    }
  } catch (e) {
    out.error = String(e?.stack || e);
  }
  window.__determinism = out;
</script>
</body>
</html>
