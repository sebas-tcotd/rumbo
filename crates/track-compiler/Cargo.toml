[package]
name = "track-compiler"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Compilador de circuitos desde geografía real (S1: OSM, grafo y ruteo; S2: elevación y pista)"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
libm = "0.2"
tiff = "0.11"

[[bin]]
name = "track-compiler"
path = "src/bin/track-compiler.rs"

[dev-dependencies]
# Solo para las pruebas: comprobar que la pista generada la acepta y la recorre el simulador.
sim-core = { path = "../sim-core" }
