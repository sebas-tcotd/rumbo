[package]
name = "track-compiler"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Compilador de circuitos desde geografía real (S1: ingesta OSM, proyección, grafo y ruteo)"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
libm = "0.2"

[[bin]]
name = "track-compiler"
path = "src/bin/track-compiler.rs"
